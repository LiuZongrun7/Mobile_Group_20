# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Build modules in parallel. Safe here because there is a single module, and
# Gradle only parallelises what the task graph allows.
org.gradle.parallel=true

# Reuse outputs of tasks whose inputs have not changed, across builds.
org.gradle.caching=true

# Reuse the configuration phase as well, which is what makes incremental builds
# noticeably faster. If a plugin ever fails with a configuration-cache error,
# comment this line out to confirm the cause before digging further.
org.gradle.configuration-cache=true

# Public forum endpoint. Passwords and session tokens are never build properties.
forumBaseUrl=https://43.140.212.47/api/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
