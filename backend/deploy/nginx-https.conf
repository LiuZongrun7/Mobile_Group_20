server {
    listen 80;
    server_name 43.140.212.47;
    location /.well-known/acme-challenge/ {
        root /var/lib/tokentrail-acme;
    }
    location / { return 301 https://43.140.212.47$request_uri; }
}

server {
    listen 443 ssl;
    server_name 43.140.212.47;
    ssl_certificate /etc/letsencrypt/live/tokentrail-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokentrail-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 11m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;

    location = /forum-health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
    }
    location /api/forum/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
    }
    # 中转。**这一段的超时和上面不一样是必须的**：编码 agent 的一次请求
    # （长上下文 + 思考模型 + 流式输出）动辄几分钟，45s 会在正常对话中途掐断连接，
    # 而症状是「用一会儿就断」，很容易被误判成网络问题。
    location /api/relay/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # 流式（SSE）必须关掉响应缓冲，否则 nginx 会攒够一块才转发，
        # 客户端看起来就是「打字机效果没了」。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # 长上下文请求体可能很大，这个值要高于最大的对话体积。
        client_max_body_size 32m;
    }
    location /test-api/ {
        proxy_pass http://127.0.0.1:8011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 45s;
    }
    # §账号（2026-02 起走这个后端）§。注册、登录、查我、退出。
    # 它是 App 的账号，和用量、结算共用同一个 user_id。
    location /api/account/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 45s;
    }
    # ↓↓ 以下三条指向团队那台机器上的账号服务（`aibox_backend`，127.0.0.1:8000）。
    # **已经没有任何客户端调它们了**：`AccountViewModel` 现在打 `/api/account/*`。
    # 保留是为了「配置里那三行注释一打开就能回滚」，不是还在用；等确认不需要回滚
    # 之后可以连同 `/etc/tokentrail-forum.env` 里那三行一起删掉。
    location = /api/login {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/logout {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/users/me {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
