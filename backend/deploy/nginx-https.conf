server {
    listen 80;
    server_name 43.140.212.47;
    location /.well-known/acme-challenge/ {
        root /var/lib/tokentrail-acme;
    }
    location / { return 301 https://43.140.212.47$request_uri; }
}

server {
    listen 443 ssl;
    server_name 43.140.212.47;
    ssl_certificate /etc/letsencrypt/live/tokentrail-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokentrail-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 11m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;

    location = /forum-health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
    }
    location /api/forum/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
    }
    # Reuse the existing account service without exposing its admin/API surface here.
    location = /api/login {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/logout {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/users/me {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
